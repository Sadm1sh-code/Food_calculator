<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Срок годности">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Расчёт срока годности</title>
<style>
  /* ============ ТЕМЫ ============ */
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --input-bg: #ffffff;
    --display-bg: #f1f3f4;
    --primary: #1a73e8;
    --primary-hover: #1558b0;
    --primary-soft: #e8f0fe;
    --error: #d93025;
    --komp-bg: #f4cccc;
    --komp-text: #a50e0e;
    --partial-bg: #fff2cc;
    --partial-text: #8a6100;
    --nokomp-bg: #d9ead3;
    --nokomp-text: #1e6b2c;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e1e;
      --card: #2a2a2a;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --border: #3c4043;
      --input-bg: #3c4043;
      --display-bg: #35363a;
      --primary: #8ab4f8;
      --primary-hover: #a8c7fa;
      --primary-soft: #1a3a5c;
      --error: #f28b82;
      --komp-bg: #5c2626;
      --komp-text: #f8bbbb;
      --partial-bg: #5c4a1a;
      --partial-text: #ffe4a8;
      --nokomp-bg: #2a4a2e;
      --nokomp-text: #b6e3bd;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --card: #2a2a2a;
    --text: #e8eaed;
    --text-secondary: #9aa0a6;
    --border: #3c4043;
    --input-bg: #3c4043;
    --display-bg: #35363a;
    --primary: #8ab4f8;
    --primary-hover: #a8c7fa;
    --primary-soft: #1a3a5c;
    --error: #f28b82;
    --komp-bg: #5c2626;
    --komp-text: #f8bbbb;
    --partial-bg: #5c4a1a;
    --partial-text: #ffe4a8;
    --nokomp-bg: #2a4a2e;
    --nokomp-text: #b6e3bd;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  :root[data-theme="light"] {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --input-bg: #ffffff;
    --display-bg: #f1f3f4;
    --primary: #1a73e8;
    --primary-hover: #1558b0;
    --primary-soft: #e8f0fe;
    --error: #d93025;
    --komp-bg: #f4cccc;
    --komp-text: #a50e0e;
    --partial-bg: #fff2cc;
    --partial-text: #8a6100;
    --nokomp-bg: #d9ead3;
    --nokomp-text: #1e6b2c;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 16px;
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  .container { max-width: 520px; margin: 0 auto; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 20px;
    margin: 0;
    color: var(--primary);
    font-weight: 600;
  }

  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ============ ТЕМА ============ */
  .theme-toggle {
    display: flex;
    background: var(--display-bg);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .theme-btn {
    border: none;
    background: transparent;
    font-size: 16px;
    padding: 6px 10px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1;
    color: var(--text-secondary);
  }

  .theme-btn.active {
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    transform: scale(1.05);
  }

  .theme-btn:active { transform: scale(0.95); }

  /* ============ ПОЛЯ ============ */
  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  input[type="date"],
  input[type="number"] {
    width: 100%;
    padding: 14px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.3s, color 0.3s;
    -webkit-appearance: none;
    appearance: none;
    min-height: 50px;
  }

  input[type="date"]:focus,
  input[type="number"]:focus {
    border-color: var(--primary);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
  }

  :root[data-theme="dark"] input[type="date"],
  :root[data-theme="dark"] input[type="number"] { color-scheme: dark; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

  /* ============ БЫСТРЫЕ КНОПКИ ============ */
  .quick-btns {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .quick-btn {
    background: var(--primary-soft);
    color: var(--primary);
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    flex-shrink: 0;
  }

  .quick-btn:hover { opacity: 0.85; }
  .quick-btn:active { transform: scale(0.95); }

  .field-hint {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    padding-left: 4px;
  }

  .field-hint strong {
    color: var(--primary);
    font-weight: 600;
  }

  /* ============ ДЕЙСТВИЕ ============ */
  .action-box {
    margin-top: 8px;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: var(--display-bg);
    color: var(--text-secondary);
    transition: background 0.4s, color 0.4s, transform 0.3s;
    letter-spacing: 0.3px;
  }

  .action-box.komp { background: var(--komp-bg); color: var(--komp-text); }
  .action-box.partial { background: var(--partial-bg); color: var(--partial-text); }
  .action-box.nokomp { background: var(--nokomp-bg); color: var(--nokomp-text); }

  .action-box.flash {
    animation: actionFlash 0.4s ease-out;
  }

  @keyframes actionFlash {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ============ ДНИ ============ */
  .days-box {
    margin-top: 16px;
    padding: 14px;
    background: var(--display-bg);
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    color: var(--text-secondary);
    transition: background 0.3s, color 0.3s;
  }

  .days-box strong {
    font-size: 22px;
    color: var(--primary);
    display: block;
    margin-top: 4px;
    transition: color 0.3s;
  }

  .days-box strong.bump {
    animation: numberBump 0.3s ease-out;
  }

  @keyframes numberBump {
    0%   { transform: scale(1); opacity: 0.4; }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ============ КНОПКИ ============ */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
  }

  .btn:active { transform: scale(0.98); }

  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-hover); }

  .btn-secondary {
    background: var(--display-bg);
    color: var(--text);
    margin-top: 8px;
  }

  .btn-secondary:active { opacity: 0.7; }

  /* ============ ИСТОРИЯ ============ */
  .history-item {
    padding: 12px;
    border-radius: 8px;
    background: var(--display-bg);
    margin-bottom: 8px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s, background 0.3s;
    animation: itemIn 0.3s ease-out;
  }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .history-item:active { opacity: 0.7; transform: scale(0.98); }

  .history-info { flex: 1; min-width: 0; }

  .history-main {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .history-sub {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .history-action {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .history-action.komp { background: var(--komp-bg); color: var(--komp-text); }
  .history-action.partial { background: var(--partial-bg); color: var(--partial-text); }
  .history-action.nokomp { background: var(--nokomp-bg); color: var(--nokomp-text); }

  .history-empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 20px;
    font-size: 14px;
  }

  .btn-clear-history {
    background: transparent;
    color: var(--error);
    border: 1.5px solid var(--error);
    padding: 10px;
    margin-top: 8px;
    font-size: 14px;
  }

  .install-banner {
    display: none;
    background: var(--primary);
    color: #fff;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  .install-banner.show { display: block; }
  .install-banner:active { opacity: 0.85; }

  /* ============ АНИМАЦИИ ============ */
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="install-banner" id="installBanner">
    📲 Установить приложение на телефон
  </div>

  <div class="card">
    <div class="header-row">
      <h1>📦 Расчёт срока годности</h1>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="auto"  title="Авто">🌗</button>
        <button class="theme-btn" data-theme="light" title="Светлая">☀️</button>
        <button class="theme-btn" data-theme="dark"  title="Тёмная">🌙</button>
      </div>
    </div>

    <!-- Дата изготовления -->
    <div class="field">
      <label>Дата изготовления</label>
      <input type="date" id="c1">
      <div class="quick-btns">
        <button class="quick-btn" onclick="setToday('c1')">Сегодня</button>
        <button class="quick-btn" onclick="shiftDate('c1', -1)">−1 д</button>
        <button class="quick-btn" onclick="shiftDate('c1', -7)">−7 д</button>
      </div>
    </div>

    <!-- Срок хранения -->
    <div class="field">
      <label>Срок хранения (дней)</label>
      <input type="number" id="c2" placeholder="дней" min="1" max="9999">
      <div class="quick-btns">
        <button class="quick-btn" onclick="setShelf(3)">3 дн</button>
        <button class="quick-btn" onclick="setShelf(7)">7 дн</button>
        <button class="quick-btn" onclick="setShelf(14)">14 дн</button>
        <button class="quick-btn" onclick="setShelf(30)">30 дн</button>
      </div>
    </div>

    <!-- Годен до -->
    <div class="field">
      <label>Годен до</label>
      <input type="date" id="c3">
      <div class="quick-btns">
        <button class="quick-btn" onclick="setToday('c3')">Сегодня</button>
        <button class="quick-btn" onclick="shiftDate('c3', 7)">+7 д</button>
        <button class="quick-btn" onclick="shiftDate('c3', 30)">+30 д</button>
      </div>
      <div class="field-hint" id="b3-hint">Введите дату изготовления и срок — рассчитается автоматически</div>
    </div>

  <!-- Дата заказа -->
  <div class="field">
    <label>Дата заказа</label>
    <input type="date" id="c4">
    <div class="quick-btns">
      <button class="quick-btn" onclick="setToday('c4')">Сегодня</button>
      <button class="quick-btn" onclick="shiftDate('c4', -1)">−1 д</button>
    </div>
  </div>

    <div class="action-box" id="b5">—</div>

    <div class="days-box">
      Дней до конца срока
      <strong id="b6">—</strong>
    </div>

    <button class="btn btn-primary" style="margin-top: 20px;"
            onclick="saveToHistory(this)">
      💾 Сохранить в историю
    </button>

    <button class="btn btn-secondary" onclick="resetAll()">
      🗑 Очистить форму
    </button>
  </div>

  <div class="card">
    <h2>📋 История (последние 10)</h2>
    <div id="historyList">
      <div class="history-empty">Пока ничего нет</div>
    </div>
    <button class="btn btn-clear-history" onclick="clearHistory()">
      Очистить историю
    </button>
  </div>

</div>

<script>
// =====================================================
// КОНСТАНТЫ
// =====================================================
const STORAGE_FORM = "sg_form_v3";
const STORAGE_HISTORY = "sg_history_v3";
const STORAGE_THEME = "sg_theme_v1";
const MAX_HISTORY = 10;

// =====================================================
// УТИЛИТЫ ДАТ
// =====================================================
function formatDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return "—";
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return dd + "." + mm + "." + d.getFullYear();
}

function dateFromInput(val) {
  if (!val) return null;
  const parts = val.split("-");
  if (parts.length !== 3) return null;
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function dateToInput(d) {
  if (!(d instanceof Date) || isNaN(d)) return "";
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return yyyy + "-" + mm + "-" + dd;
}

function todayDate() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

// =====================================================
// DEBOUNCE — защита от слишком частых вызовов
// =====================================================
function debounce(fn, delay) {
  let timer = null;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// =====================================================
// БЫСТРЫЕ ДЕЙСТВИЯ
// =====================================================
function setToday(id) {
  const el = document.getElementById(id);
  el.value = dateToInput(todayDate());
  recalc(id);
  saveForm();
}

function shiftDate(id, days) {
  const el = document.getElementById(id);
  let base = dateFromInput(el.value);
  if (!base) base = todayDate();
  base.setDate(base.getDate() + days);
  el.value = dateToInput(base);
  recalc(id);
  saveForm();
}

function setShelf(n) {
  const el = document.getElementById("c2");
  el.value = n;
  recalc("c2");
  saveForm();
}

// =====================================================
// ПЕРЕСЧЁТ
// =====================================================
let isUpdating = false;

function recalc(source) {
  if (isUpdating) return;
  isUpdating = true;

  const c1El = document.getElementById("c1");
  const c2El = document.getElementById("c2");
  const c3El = document.getElementById("c3");
  const c4El = document.getElementById("c4");

  let dateMade  = dateFromInput(c1El.value);
  let shelfLife = c2El.value === "" ? NaN : Number(c2El.value);
  let goodUntil = dateFromInput(c3El.value);
  const orderDate = dateFromInput(c4El.value);

  // ==== ЛОГИКА СИНХРОНИЗАЦИИ ====
  //
  // ВАЖНО: пересчёт C3 при смене C1 или C2 срабатывает ВСЕГДА,
  // если есть и дата изготовления, и срок хранения.
  //
  if (source === "load") {
    // При загрузке — ничего не пересчитываем
  } else if (source === "c1" || source === "c2") {
    // Изменение даты изготовления или срока → всегда пересчитываем "Годен до"
    if (dateMade && !isNaN(shelfLife) && shelfLife > 0) {
      goodUntil = new Date(dateMade);
      goodUntil.setDate(goodUntil.getDate() + shelfLife - 1);
      c3El.value = dateToInput(goodUntil);
    } else if (!shelfLife || shelfLife <= 0) {
      // Если срок пустой — не трогаем C3 (пользователь сам вводит)
    }
  } else if (source === "c3") {
    // Изменение "Годен до" → пересчитываем срок хранения
    if (dateMade && goodUntil) {
      const diff = Math.round((goodUntil - dateMade) / 86400000) + 1;
      if (diff > 0) {
        shelfLife = diff;
        c2El.value = diff;
      } else {
        shelfLife = NaN;
        c2El.value = "";
      }
    }
  }
  // source === "c4" → ничего не пересчитываем, только отображение

  // ==== ПОДСКАЗКА ПОД "ГОДЕН ДО" ====
  const hint = document.getElementById("b3-hint");
  if (goodUntil) {
    hint.innerHTML = `Годен до: <strong>${formatDate(goodUntil)}</strong>`;
  } else {
    hint.textContent = "Введите дату изготовления и срок — рассчитается автоматически";
  }

  // ==== ДЕЙСТВИЕ ====
  let action = "";
  let daysLeftText = "—";

  if (dateMade && goodUntil && orderDate && !isNaN(shelfLife) && shelfLife > 0) {
    const daysLeft = Math.round((goodUntil - orderDate) / 86400000) + 1;
    daysLeftText = daysLeft;

    if (shelfLife <= 7) {
      if (daysLeft < 2)        action = "Компенсируем";
      else if (daysLeft === 2) action = "Частично компенсируем";
      else                     action = "Не компенсируем";
    } else if (shelfLife <= 30) {
      const half = Math.floor(shelfLife / 2);
      if (daysLeft < half)        action = "Компенсируем";
      else if (daysLeft === half) action = "Частично компенсируем";
      else                        action = "Не компенсируем";
    } else {
      if (daysLeft < 8)        action = "Компенсируем";
      else if (daysLeft === 8) action = "Частично компенсируем";
      else                     action = "Не компенсируем";
    }
  }

  // ==== АНИМАЦИЯ ДНЕЙ ====
  const b6El = document.getElementById("b6");
  if (b6El.textContent !== String(daysLeftText)) {
    b6El.textContent = daysLeftText;
    b6El.classList.remove("bump");
    void b6El.offsetWidth;
    b6El.classList.add("bump");
  }

  // ==== АНИМАЦИЯ ДЕЙСТВИЯ ====
  const b5 = document.getElementById("b5");
  if (b5.textContent !== (action || "—")) {
    b5.textContent = action || "—";
    b5.classList.remove("komp", "partial", "nokomp", "flash");
    void b5.offsetWidth;
    if (action === "Компенсируем")               b5.classList.add("komp");
    else if (action === "Частично компенсируем") b5.classList.add("partial");
    else if (action === "Не компенсируем")       b5.classList.add("nokomp");
    if (action) b5.classList.add("flash");
  }

  if (source !== "load") saveForm();
  isUpdating = false;
}

// Debounced версия для input
const recalcDebounced = debounce((source) => recalc(source), 60);

// =====================================================
// СОХРАНЕНИЕ ФОРМЫ
// =====================================================
function saveForm() {
  const data = {
    c1: document.getElementById("c1").value,
    c2: document.getElementById("c2").value,
    c3: document.getElementById("c3").value,
    c4: document.getElementById("c4").value
  };
  try { localStorage.setItem(STORAGE_FORM, JSON.stringify(data)); } catch (e) {}
}

function loadForm() {
  try {
    const raw = localStorage.getItem(STORAGE_FORM);
    if (!raw) return;
    const data = JSON.parse(raw);
    document.getElementById("c1").value = data.c1 || "";
    document.getElementById("c2").value = data.c2 || "";
    document.getElementById("c3").value = data.c3 || "";
    document.getElementById("c4").value = data.c4 || "";
    recalc("load");
  } catch (e) {}
}

// =====================================================
// ИСТОРИЯ
// =====================================================
function getHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_HISTORY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function setHistory(arr) {
  try { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(arr)); } catch (e) {}
}

function saveToHistory(btn) {
  const c1 = document.getElementById("c1").value;
  const c2 = document.getElementById("c2").value;
  const c3 = document.getElementById("c3").value;
  const c4 = document.getElementById("c4").value;

  if (!c1 || !c2 || !c4) {
    showToast("Заполните: дата изготовления, срок, дата заказа");
    return;
  }

  const action = document.getElementById("b5").textContent;
  const daysLeft = document.getElementById("b6").textContent;

  const item = { c1, c2, c3, c4, action, daysLeft, savedAt: Date.now() };

  const history = getHistory();
  history.unshift(item);
  while (history.length > MAX_HISTORY) history.pop();
  setHistory(history);
  renderHistory();

  if (btn) {
    const orig = btn.textContent;
    btn.textContent = "✅ Сохранено!";
    setTimeout(() => btn.textContent = orig, 1200);
  }
}

function renderHistory() {
  const list = document.getElementById("historyList");
  const history = getHistory();

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">Пока ничего нет</div>';
    return;
  }

  list.innerHTML = history.map((item, idx) => {
    const d = new Date(item.savedAt);
    const timeStr = d.toLocaleString("ru-RU", {
      day: "2-digit", month: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });

    let actionClass = "nokomp";
    if (item.action === "Компенсируем") actionClass = "komp";
    else if (item.action === "Частично компенсируем") actionClass = "partial";

    const d1 = item.c1 ? item.c1.split("-").reverse().join(".") : "—";
    const d4 = item.c4 ? item.c4.split("-").reverse().join(".") : "—";

    return `
      <div class="history-item" onclick="loadFromHistory(${idx})">
        <div class="history-info">
          <div class="history-main">${d1} → ${item.c2} дн → ${d4}</div>
          <div class="history-sub">Сохранено: ${timeStr}</div>
        </div>
        <div class="history-action ${actionClass}">
          ${item.action || "—"}
        </div>
      </div>
    `;
  }).join("");
}

function loadFromHistory(idx) {
  const history = getHistory();
  const item = history[idx];
  if (!item) return;

  document.getElementById("c1").value = item.c1 || "";
  document.getElementById("c2").value = item.c2 || "";
  document.getElementById("c3").value = item.c3 || "";
  document.getElementById("c4").value = item.c4 || "";
  recalc("load");
  saveForm();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function clearHistory() {
  showConfirm("Очистить всю историю?", () => {
    setHistory([]);
    renderHistory();
    showToast("История очищена");
  });
}

// =====================================================
// ОЧИСТКА ФОРМЫ
// =====================================================
function resetAll() {
  document.getElementById("c1").value = "";
  document.getElementById("c2").value = "";
  document.getElementById("c3").value = "";
  document.getElementById("c4").value = "";
  recalc("c1");
  saveForm();
}

// =====================================================
// СОБЫТИЯ — подписка на change И input для всех полей
// =====================================================
["c1", "c2", "c3", "c4"].forEach((id) => {
  const el = document.getElementById(id);
  // change — мгновенно (закрытие календаря, Enter)
  el.addEventListener("change", () => recalc(id));
  // input — с небольшой задержкой (для мгновенного отклика)
  el.addEventListener("input", () => recalcDebounced(id));
});

// =====================================================
// ТЕМА
// =====================================================
function applyTheme(theme) {
  if (theme === "auto") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", theme);
  }

  document.querySelectorAll(".theme-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.theme === theme);
  });

  try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}
}

function loadTheme() {
  let theme = "auto";
  try {
    theme = localStorage.getItem(STORAGE_THEME) || "auto";
  } catch (e) {}
  applyTheme(theme);
}

document.querySelectorAll(".theme-btn").forEach((btn) => {
  btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
});

// =====================================================
// TOAST
// =====================================================
function showToast(message) {
  const existing = document.getElementById("toast");
  if (existing) existing.remove();

  const toast = document.createElement("div");
  toast.id = "toast";
  toast.textContent = message;
  toast.style.cssText = `
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(32, 33, 36, 0.95);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    max-width: 90%;
    text-align: center;
    animation: toastIn 0.2s ease-out;
  `;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transition = "opacity 0.3s";
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// =====================================================
// CONFIRM
// =====================================================
function showConfirm(message, onConfirm) {
  const overlay = document.createElement("div");
  overlay.style.cssText = `
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 16px;
    animation: fadeIn 0.15s;
  `;

  const dialog = document.createElement("div");
  dialog.style.cssText = `
    background: var(--card);
    color: var(--text);
    border-radius: 14px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  `;
  dialog.innerHTML = `
    <div style="font-size: 16px; margin-bottom: 16px; text-align: center;">${message}</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-secondary" style="margin: 0;" id="confirmCancel">Отмена</button>
      <button class="btn btn-primary" style="margin: 0;" id="confirmOk">Да</button>
    </div>
  `;

  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  document.getElementById("confirmCancel").onclick = () => overlay.remove();
  document.getElementById("confirmOk").onclick = () => {
    overlay.remove();
    onConfirm();
  };
  overlay.onclick = (e) => {
    if (e.target === overlay) overlay.remove();
  };
}

// =====================================================
// PWA
// =====================================================
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});

document.getElementById("installBanner").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").classList.remove("show");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// =====================================================
// СТАРТ
// =====================================================
window.addEventListener("DOMContentLoaded", () => {
  loadTheme();
  loadForm();
  renderHistory();
});
</script>
